<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#20377D" />
  <title>Acceso institucional demo · UBO Academic Hub</title>
  <link rel="stylesheet" href="./demo-selector.css" />
</head>
<body>
  <main class="demo-selector" aria-labelledby="demo-selector-title">
    <header class="demo-header">
      <p>ENTORNO INTERNO · DEMO</p>
      <h1 id="demo-selector-title">Acceso institucional UBO</h1>
      <span>Inicia sesión con un perfil simulado para acceder al ecosistema UBO Academic Hub.</span>
    </header>

    <section class="institutional-login" aria-labelledby="demo-users-title">
      <div class="demo-section-heading">
        <div>
          <p>ACCESO SIMULADO</p>
          <h2 id="demo-users-title">Ingresa tus credenciales institucionales</h2>
        </div>
      </div>
      <form id="institutional-login-form" class="institutional-login-form">
        <label>Usuario institucional<input id="institutional-username" name="username" type="text" autocomplete="username" autocapitalize="none" required /></label>
        <label>Contraseña<input id="institutional-password" name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Ingresar <span aria-hidden="true">→</span></button>
      </form>
    </section>

    <p id="demo-selector-status" class="demo-status" aria-live="polite">
      Este acceso es simulado: utiliza únicamente credenciales demo y no valida usuarios reales.
    </p>
  </main>
  <script type="module" src="./demo-selector-ui.js"></script>
</body>
</html>
