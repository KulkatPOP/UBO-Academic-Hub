services:
  postgres:
    image: postgres:16-alpine
    container_name: ubo-academic-hub-postgres
    environment:
      POSTGRES_DB: ubo_academic_hub
      POSTGRES_USER: ubo_admin
      POSTGRES_PASSWORD: ubo_password_demo
    ports:
      - "5432:5432"
    volumes:
      - ubo_academic_hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubo_admin -d ubo_academic_hub"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ubo_academic_hub_postgres_data:
